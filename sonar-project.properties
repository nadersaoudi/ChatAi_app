# Codenix — SonarQube configuration.
# Local scan (SonarQube already running on localhost:9000):
#   1. http://localhost:9000 → My Account → Security → generate a token
#   2. sonar-scanner -Dsonar.projectKey=codenix \
#         -Dsonar.host.url=http://localhost:9000 -Dsonar.token=YOUR_TOKEN
# CI uses SONAR_TOKEN / SONAR_HOST_URL secrets instead (see .github/workflows/ci.yml).
sonar.projectKey=codenix
sonar.projectName=Codenix
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Application code (frameworks, generated files and vendored deps excluded).
sonar.sources=backend/app,frontend/app,frontend/components,frontend/hooks,frontend/lib,frontend/layouts
sonar.exclusions=**/node_modules/**,**/.next/**,**/venv/**,**/__pycache__/**,**/*.pyc,frontend/*.config.*,frontend/*.d.ts

# Tests are analyzed separately (not counted as production code).
sonar.tests=backend/tests,frontend/tests,frontend/e2e
sonar.test.inclusions=backend/tests/**,frontend/tests/**,frontend/e2e/**
